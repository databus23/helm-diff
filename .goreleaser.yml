# To test this manually, run:
#  go install github.com/goreleaser/goreleaser@latest
#  goreleaser --snapshot --clean
#  for f in dist/helm-diff*.tgz; do echo Testing $f...; tar tzvf $f; done
project_name: helm-diff
builds:
  - id: default
    main: .
    binary: bin/diff
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -X github.com/databus23/helm-diff/v3/cmd.Version={{ .Version }}
    goos:
      - freebsd
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
  - id: linux-additional
    main: .
    binary: bin/diff
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -X github.com/databus23/helm-diff/v3/cmd.Version={{ .Version }}
    goos:
      - linux
    goarch:
      - arm
      - ppc64le
      - s390x
    goarm:
      - "6"
      - "7"

archives:
  - id: default
    builds:
    - default
    - linux-additional
    format: tgz
    name_template: '{{ .ProjectName }}-{{ if eq .Os "darwin" }}macos{{ else }}{{ .Os }}{{ end }}-{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}'
    # Wrap archives in a directory named after the archive itself
    # (e.g. helm-diff-linux-amd64/). Helm 4's plugin installer requires this
    # when installing from a local tarball: it derives the expected directory
    # from the tarball filename and fails with "plugin.yaml not found in
    # expected directory" otherwise (see issue #1071).
    wrap_in_directory: true
    files:
    - README.md
    - plugin.yaml
    - LICENSE
    - install-binary.sh
    - install-binary.ps1

signs:
  - id: plugin-provenance
    artifacts: archive
    signature: "${artifact}.prov"
    cmd: ./scripts/sign-provenance.sh
    args:
      - ${artifact}
      - ${signature}
changelog:
  use: github-native

release:
  prerelease: auto
